<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RALLY — props bench</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden;
    font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #e8e2d4; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 10px 12px;
    background: linear-gradient(transparent, rgba(10,10,12,.88) 30%); }
  #row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; color: #e8e2d4; background: #2b2f36; border: 1px solid #454b55;
    border-radius: 5px; padding: 6px 10px; }
  button:active { background: #454b55; }
  #where { flex: 1 1 220px; min-width: 200px; opacity: .9; }
  #where b { color: #d8433a; }
  input[type=range] { width: 100%; margin: 8px 0 0; }
  #head { position: fixed; top: 0; left: 0; padding: 8px 10px;
    background: linear-gradient(rgba(10,10,12,.8), transparent); }
</style>
</head>
<body>

<!-- The props bench. The game's own auto-driver crashes long before it reaches most of
     the stage, so it is no way to look at a thing standing at metre 4723. This stands
     you on the road wherever you ask, with the right sky and the right light, and steps
     between the hand-placed landmarks one at a time. No physics, no sound, no cockpit —
     just the world, so it loads in a second and can be screenshotted headlessly.

       ?at=<metres>   stand here
       ?mark=<n>      stand 35m before the nth landmark (this is what the arrows do)
       ?back=1        turn round and look back up the road
       ?lock=1        aim along the road's heading here, instead of at a point ahead —
                      which is the only way to see WHICH WAY a corner actually bends,
                      since aiming down the road hides the bend by definition
       ?track=<key>   which road — see js/tracks.js
       ?h=<metres>    eye height, default 1.15 -->

<div id="head">RALLY / props</div>
<div id="bar">
  <div id="row">
    <button id="prev">◀ prev</button>
    <button id="next">next ▶</button>
    <button id="turn">turn round</button>
    <div id="where"></div>
  </div>
  <input id="slide" type="range" min="0" max="1000" value="0">
</div>

<script type="importmap">
{ "imports": {
  "three": "./js/vendor/three.module.min.js",
  "./js/stage.js": "./js/stage.js?v=1789000232",
  "./js/atmos.js": "./js/atmos.js?v=1789000232",
  "./js/tracks.js": "./js/tracks.js?v=1789000232"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { Stage, buildStageMesh } from './js/stage.js';
import { TRACKS, DEFAULT_TRACK } from './js/tracks.js';
import { ATMOS, atmosAt } from './js/atmos.js';

const QS = new URLSearchParams(location.search);
const EYE = parseFloat(QS.get('h') || '1.15');
const LOCK = QS.get('lock') === '1';

const stage = new Stage(TRACKS[QS.get('track')] ? QS.get('track') : DEFAULT_TRACK);
const SEGMENTS = stage.segments;

// Every hand-placed landmark on the stage, in the order you'd meet them.
const MARKS = [];
SEGMENTS.forEach((seg, si) => {
  if (!seg.mark) return;
  const d0 = stage.segStartDist(si);
  for (const mk of seg.mark)
    MARKS.push({ at: d0 + seg.len * (mk.t ?? 0.5), k: mk.k, note: seg.note });
});
MARKS.sort((a, b) => a.at - b.at);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb4c4);
scene.fog = new THREE.Fog(0x9fb4c4, 120, 620);
const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.12, 2000);
const hemi = new THREE.HemisphereLight(0xcfe0ee, 0x40492f, 1.05);
const sun = new THREE.DirectionalLight(0xfff2dd, 1.15);
scene.add(hemi, sun);
scene.add(buildStageMesh(THREE, stage));

let at = parseFloat(QS.get('at') || '0');
let back = QS.get('back') === '1';
let idx = Math.max(0, Math.min(MARKS.length - 1, parseInt(QS.get('mark') || '0', 10)));
if (QS.has('mark') || !QS.has('at')) at = Math.max(4, MARKS[idx].at - 35);

const slide = document.getElementById('slide');
slide.max = Math.round(stage.length);

function draw() {
  at = Math.max(1, Math.min(stage.length - 2, at));

  // The same table the game reads, so the bench is lit and fogged like the real thing.
  const A = atmosAt(stage.sections, at);
  scene.background.setHex(A.sky);
  scene.fog.color.setHex(A.sky);
  scene.fog.near = A.fog[0];
  scene.fog.far = A.fog[1];
  camera.far = A.fog[1] * 1.25;
  camera.updateProjectionMatrix();
  sun.color.setHex(A.sun.color); sun.intensity = A.sun.int;
  sun.position.set(...A.sun.pos);
  hemi.color.setHex(A.hemi.sky); hemi.groundColor.setHex(A.hemi.ground);
  hemi.intensity = A.hemi.int;

  // Stand on the centreline and look down the road — which means finding the sample
  // ahead and aiming at IT, not at a fixed pitch, or every crest points you at the sky.
  const here = sampleAt(at), there = sampleAt(at + (back ? -55 : 55));
  camera.position.set(here.x, here.y + EYE, here.z);
  if (LOCK) {
    // Straight along the heading. The camera is rotated by PI + heading exactly as the
    // game's is, so left and right on this screen are the driver's left and right.
    camera.rotation.set(0, 0, 0);
    camera.rotateY(Math.PI + here.head * (back ? -1 : 1));
  } else {
    camera.lookAt(there.x, there.y + EYE * 0.8, there.z);
  }

  const m = MARKS[idx];
  document.getElementById('where').innerHTML =
    `${Math.round(at)}m &nbsp; ${ATMOS[stage.sectionAt(at)]?.name || ''} &nbsp;` +
    `&rarr; <b>${m.k}</b> at ${Math.round(m.at)}m &nbsp; <span style="opacity:.6">${m.note}</span>`;
  slide.value = Math.round(at);
  renderer.render(scene, camera);
}

function sampleAt(d) {
  const S = stage.samples;
  let lo = 0, hi = S.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (S[mid].dist < d) lo = mid + 1; else hi = mid; }
  return S[lo];
}

const go = n => { idx = (n + MARKS.length) % MARKS.length; at = Math.max(4, MARKS[idx].at - 35); back = false; draw(); };
document.getElementById('prev').onclick = () => go(idx - 1);
document.getElementById('next').onclick = () => go(idx + 1);
document.getElementById('turn').onclick = () => { back = !back; draw(); };
slide.oninput = () => { at = +slide.value; draw(); };
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(idx + 1);
  else if (e.key === 'ArrowLeft') go(idx - 1);
  else if (e.key === 'ArrowUp') { at += 10; draw(); }
  else if (e.key === 'ArrowDown') { at -= 10; draw(); }
});
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  draw();
});
draw();
</script>
</body>
</html>
